name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      # Testcontainers starts its own PostgreSQL; no Compose stack or database secrets needed.
      - name: Check Docker availability
        run: docker info

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Check showcase classification against shared fixtures
        run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace node:22-alpine node --test showcase/tests/*.test.mjs

      - name: Test simulator
        run: |
          python3 -m venv /tmp/telemetry-simulator-tests
          /tmp/telemetry-simulator-tests/bin/pip install -r requirements-simulator.txt
          /tmp/telemetry-simulator-tests/bin/python -m unittest discover -s tests -p 'test_*.py'

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload application JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-service-jar
          path: target/telemetry-service-*.jar
          retention-days: 7
          if-no-files-found: error

  docker:
    name: Build Docker image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Check the actual Dockerfile after the test suite passes. Nothing is published.
      - name: Build image
        run: docker build --tag telemetry-service:ci .

      - name: Build showcase and simulator images
        env:
          POSTGRES_PASSWORD: ci-build-placeholder
        run: docker compose -f compose.showcase.yml build web simulator
