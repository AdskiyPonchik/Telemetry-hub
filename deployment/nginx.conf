proxy_cache_path /var/cache/nginx/demo
    levels=1:2
    keys_zone=demo_snapshot:1m
    max_size=10m
    inactive=1m
    use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache";

    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /api/v1/demo/snapshot {
        if ($args != "") {
            return 400;
        }

        limit_except GET {
            deny all;
        }

        set $telemetry_backend http://app:8080;
        proxy_pass $telemetry_backend/api/v1/demo/snapshot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;

        proxy_cache demo_snapshot;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ^~ /api {
        return 404;
    }

    location ^~ /actuator {
        return 404;
    }

    location ^~ /swagger-ui {
        return 404;
    }

    location ^~ /v3/api-docs {
        return 404;
    }

    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
